[package]
name = "unshit-app"
description = "Windowing, event loop, and app lifecycle for the unshit UI framework"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[lints]
workspace = true

[dependencies]
unshit-core = { version = "0.1.0", path = "../unshit-core" }
unshit-renderer = { version = "0.1.0", path = "../unshit-renderer" }
winit = { workspace = true }
taffy = { workspace = true }
cosmic-text = { workspace = true }
pollster = "0.4"
log = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
flume = { workspace = true }
arboard = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }
tokio-stream = { workspace = true, optional = true }
futures-core = { workspace = true, optional = true }
notify = { version = "6", optional = true }
hdrhistogram = { version = "7.5", optional = true }

[target.'cfg(windows)'.dependencies]
winapi = { workspace = true, features = [
    "avrt",
    "libloaderapi",
    "winuser",
    # GDI, for painting the window while the GPU is still starting.
    "wingdi",
    "windef",
] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { version = "0.6.4", default-features = false, features = ["std"] }
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSApplication", "NSResponder"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSArray", "NSObject", "NSString", "NSURL"] }

[features]
default = ["clipboard", "hot-reload"]
clipboard = ["dep:arboard"]
async = ["dep:tokio", "dep:tokio-stream", "dep:futures-core"]
notifications = []
hot-reload = ["dep:notify"]
input-latency-histogram = ["dep:hdrhistogram"]

[dev-dependencies]
tokio = { workspace = true }
async-stream = { workspace = true }
futures-core = { workspace = true }
