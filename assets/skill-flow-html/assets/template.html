<html lang="en">

<style>
/* Flow Explorer, standalone. Warm amber dark theme; every surface is mono. */
:root {
  --bg-void: #14110c; --bg-base: #1c1812; --bg-subtle: #221d16; --bg-elevated: #29231a;
  --bg-hover: #342c20; --bg-selected: #3e3425;
  --border-hair: #241e15; --border-soft: #342b1e; --border-default: #4a3e2a; --border-strong: #6a5939; --border-focus: #d4a348;
  --fg-primary: #ebdcb6; --fg-secondary: #b8a275; --fg-tertiary: #857149; --fg-muted: #4e422b; --fg-ghost: #2f2819;
  --amber-100: #f6d988; --amber-300: #d4a348; --amber-400: #b8852c;
  --ember: #d06e2c; --sage: #8ba85c; --rust: #c9553a; --azure: #6aa2ad; --violet: #a88bb8;
  --r-sm: 2px; --r-md: 3px;
  --font-mono: 'JetBrains Mono', 'Berkeley Mono', 'SF Mono', Menlo, Consolas, monospace;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--bg-base); color: var(--fg-primary);
  font: 400 12px/1.5 var(--font-mono);
  font-feature-settings: 'calt' 1, 'liga' 1, 'zero' 1;
  -webkit-font-smoothing: antialiased;
}
button { font: inherit; color: inherit; }
.flow-pane { display: flex; flex-direction: column; height: 100vh; overflow: hidden; background: var(--bg-base); color: var(--fg-primary); outline: none; }

.flow-header { display: flex; flex-direction: column; gap: 4px; padding: 10px 14px; border-bottom: 1px solid var(--border-soft); }
.flow-title { font-size: 13px; color: var(--fg-primary); }
.flow-summary { font-size: 11px; color: var(--fg-secondary); }
.flow-meta { font-size: 10px; color: var(--fg-tertiary); }
.flow-range-chip { align-self: flex-start; padding: 0 6px; font-size: 10px; color: var(--fg-tertiary); background: transparent; border: 1px solid var(--border-soft); border-radius: var(--r-sm); }

.flow-toolbar { display: flex; flex-direction: column; gap: 4px; padding: 6px 14px; border-bottom: 1px solid var(--border-hair); font-size: 11px; color: var(--fg-tertiary); overflow: hidden; }
.flow-toolbar-row { display: flex; flex-wrap: wrap; align-items: center; gap: 4px; white-space: nowrap; }
.flow-toolbar-label { color: var(--fg-tertiary); margin-right: 2px; }
.flow-toolbar-spacer { flex: 1; }
.flow-tab, .flow-tool { padding: 2px 8px; font-size: 11px; color: var(--fg-secondary); background: transparent; border: 1px solid transparent; border-radius: var(--r-sm); cursor: pointer; white-space: nowrap; }
.flow-tool { border-color: var(--border-soft); }
.flow-tab:hover, .flow-tool:hover { color: var(--fg-primary); background: var(--bg-hover); }
.flow-tab.active { color: var(--fg-primary); background: var(--bg-elevated); border-color: var(--border-soft); }
.flow-tab.disabled, .flow-tab.disabled:hover { color: var(--fg-ghost); background: transparent; cursor: default; }
.flow-keys { margin-left: auto; font-size: 10px; color: var(--fg-muted); }

/* Call stack. */
.flow-tree { flex: 1; min-height: 0; overflow-y: auto; overflow-x: hidden; padding: 6px 0; }
.flow-row { display: flex; align-items: center; gap: 5px; padding: 2px 14px 2px 12px; font-size: 11px; white-space: nowrap; overflow: hidden; cursor: pointer; border-left: 2px solid transparent; }
.flow-row:hover { background: var(--bg-hover); }
.flow-row.selected { background: var(--bg-selected); }
.flow-row.diff-added { border-left-color: var(--sage); }
.flow-row.diff-removed { border-left-color: var(--rust); }
.flow-row.diff-modified { border-left-color: var(--azure); }
.flow-indent { width: 18px; flex-shrink: 0; }
.flow-connector { color: var(--fg-muted); flex-shrink: 0; }
.flow-diff-marker { width: 8px; flex-shrink: 0; color: var(--fg-tertiary); }
.flow-row.diff-added .flow-diff-marker { color: var(--sage); }
.flow-row.diff-removed .flow-diff-marker { color: var(--rust); }
.flow-row.diff-modified .flow-diff-marker { color: var(--azure); }
.flow-name { flex: 0 0 auto; color: var(--fg-primary); white-space: nowrap; }
.flow-proc-0 { color: var(--azure); }
.flow-proc-1 { color: var(--amber-300); }
.flow-proc-2 { color: var(--violet); }
.flow-proc-3 { color: var(--ember); }
.flow-proc-4 { color: var(--sage); }
.flow-proc-5 { color: var(--rust); }
.flow-carrier, .flow-tag { flex: 0 0 auto; max-width: 180px; font-size: 9px; line-height: 1.6; padding: 0 5px; border: 1px solid var(--border-soft); border-radius: var(--r-sm); color: var(--fg-secondary); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.flow-badge { color: var(--violet); flex-shrink: 0; }
/* The description takes only what is left (basis 0), so chips and the
   location keep their natural width and the sentence ellipsizes instead. */
.flow-desc { flex: 1 1 0%; min-width: 48px; color: var(--fg-secondary); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.flow-loc { flex: 0 1 auto; min-width: 40px; max-width: 220px; color: var(--fg-tertiary); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.flow-src { padding: 0 6px; font-size: 10px; color: var(--fg-tertiary); background: transparent; border: 1px solid var(--border-soft); border-radius: var(--r-sm); cursor: pointer; flex-shrink: 0; }
.flow-src:hover, .flow-src.active { color: var(--fg-primary); background: var(--bg-hover); }
.flow-placeholder { display: block; padding: 12px 14px; font-size: 11px; color: var(--fg-tertiary); }

/* Source excerpt under a row or inside a column. */
.flow-snippet-row { display: flex; align-items: flex-start; padding: 2px 14px 6px 12px; }
.flow-snippet { flex: 1; min-width: 0; display: flex; flex-direction: column; padding: 6px 0; border: 1px solid var(--border-soft); border-radius: var(--r-sm); background: var(--bg-subtle); overflow-x: auto; overflow-y: hidden; }
.flow-snippet-path { padding: 0 10px 4px 10px; font-size: 10px; color: var(--fg-tertiary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
/* Skill text has long lines; the block scrolls sideways instead of clipping. */
.flow-snippet-line { display: flex; align-items: center; padding: 0 10px; font-size: 11px; line-height: 1.5; white-space: pre; min-width: max-content; }
.flow-snippet-line.hl { background: var(--bg-hover); }
.flow-gutter { color: var(--fg-muted); padding-right: 12px; flex-shrink: 0; text-align: right; }
.flow-snippet-line.hl .flow-gutter { color: var(--fg-tertiary); }
.tok-keyword { color: var(--rust); } .tok-str { color: var(--sage); } .tok-number { color: var(--azure); }
.tok-comment { color: var(--fg-tertiary); } .tok-ident { color: var(--fg-primary); } .tok-punct { color: var(--fg-secondary); }
.flow-snippet-error { padding: 0 10px; font-size: 11px; color: var(--fg-tertiary); }

/* Legend. */
.flow-legend { display: flex; flex-direction: column; gap: 4px; padding: 6px 14px; border-top: 1px solid var(--border-hair); font-size: 10px; color: var(--fg-tertiary); overflow: hidden; }
.flow-legend-row { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; white-space: nowrap; }
.flow-legend-label { color: var(--fg-tertiary); margin-left: 10px; }
.flow-legend-label.first { margin-left: 0; }
.flow-chip { display: flex; align-items: center; gap: 4px; padding: 1px 6px; border: 1px solid var(--border-soft); border-radius: var(--r-sm); color: var(--fg-secondary); background: var(--bg-subtle); flex-shrink: 0; }
.flow-chip-icon { width: 11px; height: 11px; flex-shrink: 0; }
.flow-chip.flow-chip-state { color: var(--amber-300); border-color: var(--amber-300); }
.flow-chip.flow-chip-diff-added { color: var(--sage); border-color: var(--sage); }
.flow-chip.flow-chip-diff-removed { color: var(--rust); border-color: var(--rust); }
.flow-chip.flow-chip-diff-modified { color: var(--azure); border-color: var(--azure); }

/* Panes: Miller columns. */
.flow-panes { flex: 1; min-height: 0; display: flex; align-items: stretch; overflow-x: auto; overflow-y: hidden; }
.flow-col { flex: 1 1 0px; min-width: 200px; max-width: 480px; min-height: 0; display: flex; flex-direction: column; gap: 8px; padding: 10px 12px; border-right: 1px solid var(--border-soft); overflow-y: auto; overflow-x: hidden; font-size: 11px; }
.flow-col.focused { background: var(--bg-subtle); }
.flow-col.collapsed { flex: 0 0 auto; width: 28px; min-width: 28px; padding: 0; position: relative; overflow: hidden; cursor: pointer; }
.flow-col.collapsed:hover { background: var(--bg-hover); }
.flow-col-vlabel { position: absolute; left: 50%; top: 16px; transform: translateX(-50%) rotate(180deg); writing-mode: vertical-rl; font-size: 11px; color: var(--fg-secondary); white-space: nowrap; max-height: calc(100% - 32px); overflow: hidden; text-overflow: ellipsis; }
.flow-col-head { flex-shrink: 0; display: flex; flex-direction: column; gap: 5px; padding-bottom: 8px; border-bottom: 1px solid var(--border-hair); border-left: 2px solid transparent; }
.flow-col-head.diff-added, .flow-col-head.diff-removed, .flow-col-head.diff-modified { padding-left: 6px; }
.flow-col-head.diff-added { border-left-color: var(--sage); }
.flow-col-head.diff-removed { border-left-color: var(--rust); }
.flow-col-head.diff-modified { border-left-color: var(--azure); }
.flow-col-title-row { display: flex; flex-wrap: wrap; align-items: center; gap: 5px; }
.flow-col-title { font-size: 12px; color: var(--fg-primary); }
.flow-col-tags { display: flex; flex-wrap: wrap; gap: 4px; }
.flow-col-desc { color: var(--fg-secondary); }
.flow-col-payload, .flow-col-next { font-size: 10px; color: var(--fg-tertiary); }
.flow-section { flex-shrink: 0; display: flex; flex-direction: column; gap: 2px; }
.flow-section-label { font-size: 9px; letter-spacing: 0.08em; color: var(--fg-tertiary); margin-bottom: 2px; }
.flow-item { display: flex; align-items: center; gap: 6px; padding: 3px 8px; font-size: 11px; color: var(--fg-primary); background: transparent; border: 1px solid transparent; border-left: 2px solid transparent; border-radius: var(--r-sm); cursor: pointer; white-space: nowrap; overflow: hidden; text-align: left; width: 100%; }
.flow-item:hover { background: var(--bg-hover); }
.flow-item.active { background: var(--bg-elevated); border-color: var(--border-soft); }
.flow-item.cursor { border-color: var(--amber-300); }
.flow-item.diff-added { border-left-color: var(--sage); }
.flow-item.diff-removed { border-left-color: var(--rust); }
.flow-item.diff-modified { border-left-color: var(--azure); }
.flow-item-name { flex: 0 1 auto; min-width: 40px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.flow-col-loc { font-size: 10px; color: var(--fg-tertiary); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* Graph: swim lanes. */
.flow-graph { flex: 1; min-height: 0; display: flex; flex-direction: column; }
.flow-graph-bar { flex-shrink: 0; display: flex; flex-wrap: wrap; align-items: center; gap: 6px; padding: 6px 14px; border-bottom: 1px solid var(--border-hair); font-size: 11px; color: var(--fg-tertiary); }
.flow-crumbs { flex: 1 1 auto; min-width: 120px; display: flex; flex-wrap: wrap; align-items: center; gap: 4px; white-space: nowrap; }
.flow-crumb { padding: 1px 6px; font-size: 11px; color: var(--fg-secondary); background: transparent; border: 1px solid transparent; border-radius: var(--r-sm); cursor: pointer; white-space: nowrap; }
.flow-crumb:hover { color: var(--fg-primary); background: var(--bg-hover); }
.flow-crumb.current, .flow-crumb.current:hover { color: var(--fg-primary); background: transparent; cursor: default; }
.flow-crumb-sep { color: var(--fg-muted); }
.flow-graph-tools { flex: 0 1 auto; display: flex; flex-wrap: wrap; align-items: center; gap: 4px; white-space: nowrap; }
.flow-graph-hint { color: var(--fg-tertiary); margin-right: 8px; white-space: normal; max-width: 360px; }
.flow-depth-group { flex-shrink: 0; display: flex; align-items: center; gap: 4px; white-space: nowrap; }
.flow-graph-scroll { flex: 1; min-height: 0; overflow: auto; background: var(--bg-base); }
.flow-graph-canvas { position: relative; flex-shrink: 0; }
.flow-lane { position: absolute; border: 1px solid var(--border-hair); border-radius: var(--r-md); background: var(--bg-subtle); }
.flow-lane-pill { position: absolute; left: 12px; top: 10px; padding: 2px 10px; font-size: 11px; border: 1px solid var(--border-soft); border-radius: 999px; background: var(--bg-elevated); white-space: nowrap; }
.flow-graph-edges { position: absolute; left: 0; top: 0; color: var(--fg-muted); pointer-events: none; }
.flow-graph-node { position: absolute; display: flex; flex-direction: column; justify-content: center; gap: 2px; padding: 7px 10px; border: 1px solid var(--border-soft); border-left: 2px solid var(--border-soft); border-radius: var(--r-sm); background: var(--bg-elevated); cursor: pointer; overflow: hidden; text-align: left; }
.flow-graph-node:hover { background: var(--bg-hover); }
.flow-graph-node.event { border-radius: 999px; padding-left: 16px; }
.flow-graph-node.diff-added { border-left-color: var(--sage); }
.flow-graph-node.diff-removed { border-left-color: var(--rust); }
.flow-graph-node.diff-modified { border-left-color: var(--azure); }
.flow-graph-node-name { font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.flow-graph-node-desc { font-size: 10px; color: var(--fg-secondary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.flow-graph-badge { position: absolute; display: flex; align-items: center; justify-content: center; padding: 0; font-size: 10px; color: var(--bg-base); background: var(--violet); border: 1px solid var(--violet); border-radius: 999px; cursor: pointer; }
.flow-graph-badge:hover { background: var(--amber-300); border-color: var(--amber-300); }
.flow-graph-edge-label { position: absolute; max-width: 200px; height: 16px; line-height: 16px; padding: 0 4px; font-size: 10px; color: var(--fg-secondary); background: var(--bg-base); border-radius: var(--r-sm); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; pointer-events: none; }
.flow-error { padding: 24px; color: var(--rust); font-size: 12px; white-space: pre-wrap; }
.flow-graph-edge-label { max-width: 150px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.flow-journey { padding: 8px 14px; border-bottom: 1px solid var(--border-default); flex-shrink: 0; }
.flow-overview, .flow-crumbs { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.flow-overview .current, .flow-graph-node.focus { border-color: var(--amber-300); background: var(--bg-selected); }
.flow-focus-summary { margin-top: 6px; max-width: 1000px; color: var(--fg-secondary); }
.flow-context { position: fixed; z-index: 100; padding: 8px; background: var(--bg-elevated); border: 1px solid var(--amber-300); }
.flow-source-dialog { width: min(900px, 90vw); max-height: 80vh; background: var(--bg-base); color: var(--fg-primary); border: 1px solid var(--border-focus); }
.flow-source-dialog::backdrop { background: #0009; }
.flow-header .flow-summary { display: none; }
button:focus-visible, [role=button]:focus-visible { outline: 2px solid var(--amber-300); outline-offset: 2px; }

/* Readable graph cards and predictable navigation at every depth. */
body { font-size: 13px; }
.flow-header { padding: 14px 20px; }
.flow-title { font-size: 16px; }
.flow-toolbar, .flow-journey, .flow-graph-bar { padding-left: 20px; padding-right: 20px; }
.flow-tab, .flow-tool, .flow-crumb { font-size: 12px; padding: 5px 9px; }
.flow-graph-node, .flow-graph-node.event { padding: 14px 16px; gap: 8px; border-radius: 8px; min-height: 90px; overflow: visible; border: 1px solid #665638; box-shadow: 0 3px 10px #0002; }
.flow-graph-node-name { font-size: 14px; line-height: 1.45; white-space: normal; overflow-wrap: anywhere; overflow: visible; text-overflow: clip; font-weight: 500; }
.flow-graph-node-desc { font-size: 12px; line-height: 1.55; white-space: normal; overflow-wrap: anywhere; overflow: visible; text-overflow: clip; color: #c8b68e; }
.flow-graph-edges { color: #8b7853; opacity: .7; }
.flow-graph-node:hover { border-color: var(--amber-300); }
.flow-graph-hint { max-width: none; color: #b8a275; }
.flow-graph-stage { position: relative; margin: 0 auto; }
.flow-tool:disabled { opacity: .4; cursor: default; }
.flow-depth-group { flex-wrap: wrap; }
.flow-graph-tools { width: 100%; justify-content: space-between; gap: 10px; }
.flow-connections { flex-shrink: 0; max-height: 180px; overflow: auto; margin: 4px 20px; padding: 12px; max-width: 1000px; background: var(--bg-subtle); border: 1px solid var(--border-default); border-radius: 6px; }
.flow-connections summary, .flow-legend-toggle summary { cursor: pointer; padding: 5px; color: var(--fg-secondary); }
.flow-connection { display: block; background: transparent; border: 0; width: 100%; text-align: left; padding: 9px 4px; white-space: normal; overflow-wrap: anywhere; cursor: pointer; }
.flow-connection:hover { background: var(--bg-hover); }
.flow-legend-toggle { padding: 4px 20px; border-top: 1px solid var(--border-default); }
.flow-crumbs { flex-wrap: nowrap; overflow-x: auto; padding-top: 6px; }
.flow-crumbs > * { flex-shrink: 0; }
.flow-focus-summary { line-height: 1.6; max-height: 85px; overflow: auto; }
.flow-row { white-space: normal; padding: 10px 20px; align-items: flex-start; flex-wrap: wrap; border-bottom: 1px solid var(--border-soft); }
.flow-name, .flow-desc, .flow-item-name { white-space: normal; overflow-wrap: anywhere; text-overflow: clip; }
.flow-desc { flex-basis: 60%; font-size: 12px; }
.flow-item { padding: 10px 8px; white-space: normal; }
.flow-col { min-width: 280px; font-size: 12px; }
@media (max-width: 700px) { .flow-keys { display: none; } .flow-overview { flex-wrap: nowrap; overflow-x: auto; } .flow-title { font-size: 13px; } }


.flow-stage-map { flex: 1; overflow: auto; padding: 24px; }
.flow-map-heading { font-size: 18px; color: var(--fg-primary); }
.flow-map-intro { color: var(--fg-secondary); line-height: 1.6; margin: 8px 0 22px; }
.flow-stage-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 16px; }
.flow-stage-card { display: flex; flex-direction: column; align-items: flex-start; gap: 12px; padding: 20px; text-align: left; border: 1px solid #665638; border-radius: 10px; background: var(--bg-elevated); cursor: pointer; min-width: 0; }
.flow-stage-card:hover { border-color: var(--amber-300); background: var(--bg-hover); }
.flow-step-index { color: var(--fg-secondary); font-size: 10px; letter-spacing: .1em; }
.flow-stage-name { font-size: 15px; font-weight: 500; overflow-wrap: anywhere; }
.flow-stage-desc { color: #c8b68e; font-size: 12px; line-height: 1.65; }
.flow-stage-follow { margin-top: auto; padding-top: 10px; color: var(--fg-primary); font-size: 11px; }
.flow-outcome { display: flex; flex-direction: column; gap: 8px; padding: 16px 20px; margin-top: 22px; width: 100%; text-align: left; color: var(--fg-secondary); background: transparent; border: 1px solid var(--border-default); border-radius: 8px; cursor: pointer; line-height: 1.6; }
.flow-scroll-hint { padding: 6px 20px; color: var(--fg-secondary); border-top: 1px solid var(--border-default); font-size: 11px; }
.flow-keys { color: var(--fg-secondary); }
@media (max-width: 1150px) { .flow-stage-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } .flow-stage-map { padding: 16px; } .flow-stage-card { padding: 14px; gap: 8px; } }
@media (max-width: 620px) { .flow-stage-grid { grid-template-columns: 1fr; } }
</style>

})();
